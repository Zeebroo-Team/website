# Auto-deploy to Ubuntu server on push to main.
# Required GitHub secrets: SSH_HOST, SSH_USER, SSH_PRIVATE_KEY
# Optional secrets: SSH_PORT (default 22), DEPLOY_PATH, SERVICE_NAME

name: Deploy to production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script_stop: true
          command_timeout: 5m
          script: |
            set -euo pipefail
            export DEPLOY_PATH="${{ secrets.DEPLOY_PATH }}"
            export SERVICE_NAME="${{ secrets.SERVICE_NAME }}"
            if [ -z "${DEPLOY_PATH}" ]; then export DEPLOY_PATH="/var/www/melting-app"; fi
            if [ -z "${SERVICE_NAME}" ]; then export SERVICE_NAME="melting-app"; fi
            cd "${DEPLOY_PATH}"
            CURRENT_REMOTE="$(git remote get-url origin 2>/dev/null || true)"
            if [[ -n "${CURRENT_REMOTE}" && "${CURRENT_REMOTE}" != *"github.com"* ]]; then
              REPO_PATH="$(echo "${CURRENT_REMOTE}" | sed 's/.*:\(.*\)/\1/')"
              git remote set-url origin "git@github.com:${REPO_PATH}"
              echo "==> Fixed remote URL: git@github.com:${REPO_PATH}"
            fi
            bash "${DEPLOY_PATH}/scripts/deploy.sh"
