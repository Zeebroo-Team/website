# Example Nginx reverse proxy — e.g. /etc/nginx/sites-available/zeebroo
# Melt listens on port 8788 (see config/app.melt).
#
#   sudo ln -s /etc/nginx/sites-available/zeebroo /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name zeebroo.com www.zeebroo.com;

    client_max_body_size 32m;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    location / {
        proxy_pass http://127.0.0.1:8788;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~* \.(?:css|js|json|xml|txt|svg|ico|png|jpg|jpeg|webp|gif|mp4)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri $uri/ =404;
    }
}

